[tools]
go = "1.23"
node = "20"
npm = "9"
"go:github.com/wailsapp/wails/v2/cmd/wails" = "2.11"

[tasks.setup]
description = "Install backend and frontend dependencies"
run = """
go mod tidy
cd frontend && npm install
"""

[tasks."dev"]
description = "Run the application in development mode with hot-reloading"
depends = ["setup"]
run = "wails dev"

[tasks."build:deps"]
description = "Install frontend dependencies for production build"
run = "npm install --prefix frontend"

[tasks."build:cli-linux"]
description = "Build highly optimized, minimal headless CLI binary"
run = "GOOS=linux GOARCH=amd64 go build -ldflags='-s -w' -trimpath -o build/bin/sssd-inspector-cli-linux-amd64 cmd/sssd-inspector-cli/main.go"

[tasks."build:cli-windows"]
description = "Compile standalone CLI for Windows (amd64)"
run = "GOOS=windows GOARCH=amd64 go build -ldflags='-s -w' -trimpath -o build/bin/sssd-inspector-cli-windows-amd64.exe cmd/sssd-inspector-cli/main.go"

[tasks."build:cli-mac-intel"]
description = "Compile standalone CLI for older Intel Macs (amd64)"
run = "GOOS=darwin GOARCH=amd64 go build -ldflags='-s -w' -trimpath -o build/bin/sssd-inspector-cli-darwin-amd64 cmd/sssd-inspector-cli/main.go"

[tasks."build:cli-mac-silicon"]
description = "Compile standalone CLI for Apple Silicon Macs (arm64)"
run = "GOOS=darwin GOARCH=arm64 go build -ldflags='-s -w' -trimpath -o build/bin/sssd-inspector-cli-darwin-arm64 cmd/sssd-inspector-cli/main.go"

[tasks."build:cli-all"]
description = "Compile standalone CLI for ALL target platforms simultaneously"
depends = ["build:cli-linux", "build:cli-windows", "build:cli-mac-intel", "build:cli-mac-silicon"]

[tasks.run]
description = "Run the application"
depends = ["build"]
run = "sssd-inspector"

[tasks.test]
description = "Run all unit and integration tests recursively with race detection"
run = "go test -v -race -timeout=5m ./..."
