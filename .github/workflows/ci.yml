name: CI

on:
  push:
    branches: ["main", "development", "new1", "fix-pii", "logdir"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install hybrid (GUI) build dependencies
        # The hybrid binary links GTK + WebKit via Wails; the static CLI
        # binary (build tag cli) needs no system libraries.
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: gofmt check
        run: |
          bad=$(gofmt -l . | grep -v '^node_modules' | grep -v '/frontend/' || true)
          if [ -n "$bad" ]; then echo "not gofmt-clean: $bad"; exit 1; fi

      - name: go vet (both build modes)
        run: |
          go vet ./...
          go vet -tags cli ./...

      - name: Build both binaries
        run: |
          go build -o /tmp/sssd-inspector-hybrid .
          go build -tags cli -o /tmp/sssd-inspector-cli .

      - name: Unit tests (default build)
        run: go test ./...

      - name: Unit tests (cli build tag)
        # Guards the static CLI binary: integration_test.go is GUI-only and
        # carries //go:build !cli, so this matrix must stay green.
        run: go test -tags cli ./...

      - name: Race detector
        run: |
          go test -race ./...
          go test -race -tags cli ./...

      - name: CLI smoke test (flag surface + end-to-end analyze)
        run: |
          /tmp/sssd-inspector-cli -analyze ./kb_articles -json >/tmp/smoke.json 2>/dev/null || true
          /tmp/sssd-inspector-cli -v | grep -q "version"
          test -s /tmp/smoke.json

      - name: CLI smoke test (raw-log mode via -logdir)
        # Guards the flag's wiring in the real binary: create raw SSSD logs
        # with an error and a domain, run -logdir with -anonymize, and assert
        # that (a) the error is detected and (b) the domain was redacted.
        run: |
          mkdir -p /tmp/rawlogs
          printf '%s\n' \
            '(2026-09-18 10:00:01): [sssd[be[ldap_id]]] Connection failed: Clock skew too great' \
            '(2026-09-18 10:00:03): [sssd[be[ldap_id]]] Domain [intra.swm.de] is offline' \
            > /tmp/rawlogs/sssd_intra.swm.de.log
          /tmp/sssd-inspector-cli -logdir /tmp/rawlogs -json -anonymize >/tmp/logdir.out 2>&1
          test -s /tmp/rawlogs/../rawlogs_report.json || test -s rawlogs_report.json
          grep -q "Clock skew" /tmp/logdir.out
          ! grep -q "intra.swm.de" rawlogs_report.json
          grep -q "example.com" rawlogs_report.json
          # -logdir must also be advertised in the usage output
          /tmp/sssd-inspector-cli -h 2>&1 | grep -q -- "-logdir"
