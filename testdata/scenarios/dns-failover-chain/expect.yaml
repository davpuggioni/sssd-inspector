id: dns-failover-chain
title: Cascata DNS/SRV -> connessione -> offline
notes: 'Difetto iniettato: i log mostrano la catena timeout SRV -> resolve fallito -> connessione fallita -> Going offline Il motore di sequenza deve consolidarla in UNA root cause piu'' il finding offline.'
